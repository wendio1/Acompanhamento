<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Central de Transmissão</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090D">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Central de Transmissão">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090D;
    --bg-glow:#12151F;
    --panel:#12141B;
    --panel-2:#0C0E14;
    --border:#22262F;
    --border-soft:#191C24;
    --text:#F1F3F7;
    --text-dim:#848CA0;
    --text-faint:#4C5262;
    --red:#FF5C5C;
    --green:#3ECF8E;
    --amber:#FFB238;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:36px 24px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .scanline{
    position:fixed; inset:0; pointer-events:none; z-index:50; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
  .wrap{max-width:1160px; margin:0 auto;}
  svg{display:block;}

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:28px; flex-wrap:wrap; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .rec-dot{
    width:9px; height:9px; border-radius:50%; background:var(--red); margin-top:2px;
    box-shadow:0 0 12px var(--red); flex-shrink:0;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-dim);
    letter-spacing:1.6px; text-transform:uppercase; margin-bottom:4px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-size:25px; font-weight:700;
    margin:0; letter-spacing:.2px;
  }
  .clock-block{text-align:right;}
  .countdown{
    font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; color:var(--amber);
    letter-spacing:1px; text-shadow:0 0 20px rgba(255,178,56,.25);
  }
  .countdown-label{font-size:10.5px; color:var(--text-dim); letter-spacing:1.2px; text-transform:uppercase;}

  .summary{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; margin-bottom:28px;
  }
  .summary-item{
    background:var(--panel-2); padding:18px 22px;
    display:flex; flex-direction:column; gap:4px;
  }
  .summary-val{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px; color:var(--text);
  }
  .summary-label{
    font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.2px;
  }

  .toast{
    display:none;
    background:linear-gradient(90deg, rgba(62,207,142,.12), transparent 70%);
    border:1px solid rgba(62,207,142,.4); color:var(--green);
    font-family:'JetBrains Mono',monospace; font-size:12.5px;
    padding:12px 16px; border-radius:8px; margin-bottom:20px;
  }
  .toast.show{display:block;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px;
  }
  .card{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:14px;
    padding:22px; position:relative; overflow:hidden;
    transition:border-color .2s ease, transform .2s ease;
  }
  .card:hover{border-color:var(--border); transform:translateY(-2px);}
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, var(--card-accent, var(--red)), transparent 85%);
  }
  .card-head{display:flex; gap:13px; align-items:center; margin-bottom:20px;}
  .avatar-wrap{position:relative; flex-shrink:0;}
  .avatar{
    width:50px; height:50px; border-radius:50%; object-fit:cover;
    border:1px solid var(--border); background:#1a1d26; display:block;
  }
  .avatar-ring{
    position:absolute; inset:-3px; border-radius:50%;
    border:1.5px solid var(--card-accent, var(--red)); opacity:.5;
  }
  .ch-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15.5px; line-height:1.3;}
  .ch-handle{font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:1px;}

  .stats-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:20px;}
  .stat{
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:8px;
    padding:10px 6px; text-align:center;
  }
  .stat-icon{margin:0 auto 6px; color:var(--text-faint); width:14px; height:14px;}
  .stat-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--text); line-height:1; display:flex; align-items:center; justify-content:center; gap:5px;}
  .stat-label{font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.7px; margin-top:4px;}

  .delta-badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:var(--green);
    background:rgba(62,207,142,.14); border:1px solid rgba(62,207,142,.4);
    padding:1px 5px; border-radius:99px; animation:deltaPop .4s ease;
  }
  @keyframes deltaPop{0%{transform:scale(.6); opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1); opacity:1;}}

  .goal{margin-bottom:18px;}
  .goal-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:7px;
  }
  .goal-label{
    font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1.4px;
    font-family:'JetBrains Mono',monospace;
  }
  .goal-pct{
    font-size:11.5px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--text);
  }
  .goal-track{
    height:7px; background:var(--panel-2); border:1px solid var(--border-soft); border-radius:99px;
    overflow:hidden;
  }
  .goal-fill{
    height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--card-accent, var(--red)), color-mix(in srgb, var(--card-accent, var(--red)) 60%, white));
    transition:width .6s ease;
  }
  .goal-note{
    font-size:10.5px; color:var(--text-dim); margin-top:6px; font-family:'JetBrains Mono',monospace;
  }
  .goal-note.done{color:var(--green);}
  .hours-input{
    background:var(--panel-2); border:1px solid var(--border-soft); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:11px; width:64px; padding:3px 6px;
    border-radius:5px; margin-right:5px;
  }
  .hours-input:focus{outline:1.5px solid var(--card-accent, var(--amber)); border-color:transparent;}
  .goal-alt{
    font-size:10px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; margin-top:10px;
  }

  .divider{height:1px; background:var(--border-soft); margin:0 0 16px;}
  .latest-label{
    font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1.4px;
    margin-bottom:10px; font-family:'JetBrains Mono',monospace;
  }
  .latest-list{display:flex; flex-direction:column;}
  .video-sep{height:1px; background:var(--border-soft); margin:12px 0;}
  .latest{display:flex; gap:12px; text-decoration:none; color:inherit;}
  .latest-thumb-wrap{
    position:relative; width:88px; height:50px; flex-shrink:0; border-radius:8px; overflow:hidden;
    border:1px solid var(--border-soft);
  }
  .latest-thumb{width:100%; height:100%; object-fit:cover; background:#1a1d26; display:block; transition:transform .3s ease;}
  .latest:hover .latest-thumb{transform:scale(1.06);}
  .latest-title{
    font-size:12.5px; line-height:1.4; margin-bottom:8px; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .latest-meta{font-size:10.5px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; margin-bottom:6px;}
  .video-stats{display:flex; gap:12px; font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .video-stats span{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .video-stats svg{width:12px; height:12px; opacity:.7;}

  .skeleton{opacity:.45;}
  .skel-block{background:#191c25; border-radius:6px; animation:shimmer 1.4s ease-in-out infinite;}
  @keyframes shimmer{0%,100%{opacity:.5;}50%{opacity:.9;}}

  .error-box{
    color:var(--red); font-size:12px; font-family:'JetBrains Mono',monospace;
    background:rgba(255,92,92,.07); border:1px solid rgba(255,92,92,.25);
    padding:12px; border-radius:8px; margin-top:4px;
  }
  .error-box .retry-btn{
    display:inline-block; margin-top:8px; background:transparent; border:1px solid rgba(255,92,92,.4);
    color:var(--red); font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:5px 10px;
    border-radius:6px; cursor:pointer;
  }
  .error-box .retry-btn:hover{background:rgba(255,92,92,.12);}

  .section-title{
    display:flex; align-items:center; gap:10px; margin:38px 0 16px;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);
    letter-spacing:1.6px; text-transform:uppercase;
  }
  .section-title::after{content:""; flex:1; height:1px; background:var(--border-soft);}

  .tiktok-field{margin-bottom:14px;}
  .tiktok-field-head{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;
  }
  .tiktok-field-label{
    font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1.2px;
    font-family:'JetBrains Mono',monospace;
  }
  .tiktok-input-row{display:flex; align-items:center; gap:8px;}
  .tiktok-input{
    background:var(--panel-2); border:1px solid var(--border-soft); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; width:100%;
    padding:9px 10px; border-radius:8px;
  }
  .tiktok-input:focus{outline:1.5px solid var(--card-accent, var(--amber)); border-color:transparent;}
  .tiktok-updated{
    font-size:10px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; margin-top:14px;
  }

  footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:30px;
    font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; flex-wrap:wrap; gap:12px;
  }
  button{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:9px 16px;
    border-radius:8px; cursor:pointer; letter-spacing:.5px; transition:.15s ease;
  }
  button:hover{border-color:var(--red); color:var(--red);}
  button:focus-visible, a:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){.rec-dot,.skel-block,.card,.latest-thumb{animation:none; transition:none;}}
  @media (max-width:640px){
    .summary{grid-template-columns:1fr;}
    header{flex-direction:column;}
    .clock-block{text-align:left;}
  }
</style>
</head>
<body>
<div class="scanline"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-users" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M23 21v-2a4 4 0 0 0-3-3.87"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ic-video" viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m17 10 5-3v10l-5-3"/></symbol>
    <symbol id="ic-thumb" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></symbol>
    <symbol id="ic-comment" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></symbol>
  </defs>
</svg>

<div class="wrap">

  <header>
    <div class="brand">
      <span class="rec-dot"></span>
      <div>
        <div class="eyebrow">Ao vivo · atualização automática</div>
        <h1>Central de Transmissão</h1>
      </div>
    </div>
    <div class="clock-block">
      <div class="countdown-label">Próxima publicação prevista (20:30)</div>
      <div class="countdown" id="countdown">--:--:--</div>
    </div>
  </header>

  <div class="summary" id="summary">
    <div class="summary-item">
      <div class="summary-val" id="sumSubs">—</div>
      <div class="summary-label">Inscritos totais</div>
    </div>
    <div class="summary-item">
      <div class="summary-val" id="sumViews">—</div>
      <div class="summary-label">Visualizações totais</div>
    </div>
    <div class="summary-item">
      <div class="summary-val" id="sumVideos">—</div>
      <div class="summary-label">Vídeos publicados</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="grid" id="grid"></div>

  <div class="section-title">▸ TikTok · atualização manual</div>
  <div class="grid" id="tiktokGrid"></div>

  <footer>
    <span id="lastUpdated">Carregando dados...</span>
    <button id="refreshBtn">↻ Atualizar agora</button>
  </footer>

</div>

<script>
const API_KEY = 'AIzaSyCFlIPhYHsLeoMX1ivXZZ2GuNLo2ANF_wM';

const CHANNELS = [
  { handle: '@issoninguemtecontaOFC', accent: '#FF5C5C' },
  { handle: '@mantendoaféOFC',        accent: '#3ECF8E' },
  { handle: '@QuizTododiaOFC',        accent: '#FFB238' },
];

const TIKTOK_ACCOUNTS = [
  { handle: '@issoninguemtecota', name: 'Isso Ninguém Te Conta', accent: '#FF5C5C' },
  { handle: '@quiztododia',       name: 'Quiz Todo Dia',         accent: '#FFB238' },
];

const grid = document.getElementById('grid');
const tiktokGrid = document.getElementById('tiktokGrid');
const lastUpdatedEl = document.getElementById('lastUpdated');
const toastEl = document.getElementById('toast');
let lastVideoIds = {};
let lastAutoRefresh = Date.now();

// ---- controle de "novos inscritos desde a última visita" ----
// Guarda o último valor visto por canal no localStorage. Se o valor atual
// for maior, mostra um selo "+N" e depois atualiza o valor guardado.
function subscriberDelta(handle, currentSubs){
  const key = 'yt_seen_subs_' + handle;
  const stored = localStorage.getItem(key);
  let delta = 0;
  if (stored !== null && !isNaN(Number(stored))){
    const prev = Number(stored);
    if (currentSubs > prev) delta = currentSubs - prev;
  }
  localStorage.setItem(key, String(currentSubs));
  return delta;
}

function fmtNumber(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  n = Number(n);
  if (n >= 1000000) return (n/1000000).toFixed(1).replace('.0','') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace('.0','') + 'K';
  return String(n);
}

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if (mins < 60) return `há ${mins} min`;
  const hours = Math.floor(mins/60);
  if (hours < 24) return `há ${hours}h`;
  const days = Math.floor(hours/24);
  return `há ${days}d`;
}

function skeletonCard(accent){
  return `<div class="card skeleton" style="--card-accent:${accent}">
    <div class="card-head">
      <div class="skel-block" style="width:50px;height:50px;border-radius:50%;"></div>
      <div style="flex:1">
        <div class="skel-block" style="width:70%;height:14px;margin-bottom:6px;"></div>
        <div class="skel-block" style="width:50%;height:11px;"></div>
      </div>
    </div>
    <div class="skel-block" style="width:100%;height:60px;margin-bottom:16px;"></div>
    <div class="skel-block" style="width:100%;height:60px;"></div>
  </div>`;
}

function renderCard(handle, accent, data, error){
  if (error){
    return `<div class="card" style="--card-accent:${accent}">
      <div class="ch-handle">${handle}</div>
      <div class="error-box">⚠ ${error}
        <br><button class="retry-btn" onclick="refreshAll()">↻ Tentar novamente</button>
      </div>
    </div>`;
  }
  const { channel, recentVideos, statsMap } = data;
  const s = channel.statistics;
  const thumb = channel.snippet.thumbnails?.medium?.url || channel.snippet.thumbnails?.default?.url || '';
  const subsRawForDelta = Number(s.subscriberCount || 0);
  const subs = s.hiddenSubscriberCount ? 'oculto' : fmtNumber(s.subscriberCount);
  const delta = s.hiddenSubscriberCount ? 0 : subscriberDelta(handle, subsRawForDelta);
  const deltaHtml = delta > 0 ? `<span class="delta-badge">+${fmtNumber(delta)}</span>` : '';

  let latestHtml = `<div class="error-box">Sem vídeos encontrados</div>`;
  if (recentVideos && recentVideos.length){
    latestHtml = recentVideos.map(v => {
      const vThumb = v.thumbnails?.medium?.url || v.thumbnails?.default?.url || '';
      const vid = v.resourceId?.videoId;
      const url = vid ? `https://www.youtube.com/watch?v=${vid}` : '#';
      const st = vid ? statsMap[vid] : null;
      const vStatsHtml = st ? `
          <div class="video-stats">
            <span><svg><use href="#ic-eye"/></svg>${fmtNumber(st.viewCount)}</span>
            <span><svg><use href="#ic-thumb"/></svg>${fmtNumber(st.likeCount)}</span>
            <span><svg><use href="#ic-comment"/></svg>${fmtNumber(st.commentCount)}</span>
          </div>` : '';
      return `
        <a class="latest" href="${url}" target="_blank" rel="noopener">
          <div class="latest-thumb-wrap"><img class="latest-thumb" src="${vThumb}" alt=""></div>
          <div style="min-width:0">
            <div class="latest-title">${v.title}</div>
            <div class="latest-meta">${timeAgo(v.publishedAt)}</div>
            ${vStatsHtml}
          </div>
        </a>`;
    }).join('<div class="video-sep"></div>');
  }

  const subsRaw = Number(s.subscriberCount || 0);
  const goalTarget = 1000;
  const goalPct = s.hiddenSubscriberCount ? null : Math.min(100, (subsRaw / goalTarget) * 100);
  const goalRemaining = Math.max(0, goalTarget - subsRaw);
  const goalHtml = s.hiddenSubscriberCount ? '' : `
    <div class="goal">
      <div class="goal-head">
        <span class="goal-label">▸ Meta YPP · 1.000 inscritos</span>
        <span class="goal-pct">${goalPct.toFixed(1)}%</span>
      </div>
      <div class="goal-track"><div class="goal-fill" style="width:${goalPct}%"></div></div>
      <div class="goal-note ${goalRemaining === 0 ? 'done' : ''}">
        ${goalRemaining === 0 ? '✓ Meta de inscritos atingida' : `Faltam ${fmtNumber(goalRemaining)} inscritos`}
      </div>
    </div>`;

  const storedHours = Math.max(0, Number(localStorage.getItem('ypp_hours_' + handle)) || 0);
  const hoursTarget = 8000;
  const hoursPct = Math.min(100, (storedHours / hoursTarget) * 100);
  const hoursRemaining = Math.max(0, hoursTarget - storedHours);
  const hoursHtml = `
    <div class="goal">
      <div class="goal-head">
        <span class="goal-label">▸ Meta YPP · 8.000h de exibição (12 meses)</span>
        <span class="goal-pct hours-pct">${hoursPct.toFixed(1)}%</span>
      </div>
      <div class="goal-track"><div class="goal-fill hours-fill" style="width:${hoursPct}%"></div></div>
      <div class="goal-note hours-remaining ${hoursRemaining === 0 ? 'done' : ''}">
        ${hoursRemaining === 0 ? '✓ Meta de horas atingida' : `Faltam ${fmtNumber(hoursRemaining)}h`}
      </div>
      <div class="goal-alt">
        <input type="number" class="hours-input" data-handle="${handle}" value="${storedHours}" min="0" step="10">
        horas atuais (digite o valor do YouTube Studio → Analytics)
      </div>
      <div class="goal-alt" style="margin-top:4px;">Caminho alternativo: 20M views em Shorts nos últimos 90 dias</div>
    </div>`;

  return `<div class="card" style="--card-accent:${accent}">
    <div class="card-head">
      <div class="avatar-wrap">
        <img class="avatar" src="${thumb}" alt="">
        <div class="avatar-ring"></div>
      </div>
      <div>
        <div class="ch-name">${channel.snippet.title}</div>
        <div class="ch-handle">${handle}</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat"><svg class="stat-icon"><use href="#ic-users"/></svg><div class="stat-val">${subs}${deltaHtml}</div><div class="stat-label">Inscritos</div></div>
      <div class="stat"><svg class="stat-icon"><use href="#ic-eye"/></svg><div class="stat-val">${fmtNumber(s.viewCount)}</div><div class="stat-label">Views</div></div>
      <div class="stat"><svg class="stat-icon"><use href="#ic-video"/></svg><div class="stat-val">${fmtNumber(s.videoCount)}</div><div class="stat-label">Vídeos</div></div>
    </div>
    ${goalHtml}
    ${hoursHtml}
    <div class="divider"></div>
    <div class="latest-label">▸ Últimos 3 vídeos</div>
    <div class="latest-list">${latestHtml}</div>
  </div>`;
}

// ---- Cards do TikTok (sem API pública disponível: valores digitados
// manualmente e guardados no aparelho). Ao digitar um número maior de
// seguidores que o último salvo, mostra um selo "+N" temporário. ----
function renderTiktokGrid(){
  tiktokGrid.innerHTML = TIKTOK_ACCOUNTS.map(renderTiktokCard).join('');
}

function tiktokUpdatedLabel(handle){
  const raw = localStorage.getItem('tt_updated_' + handle);
  if (!raw) return 'ainda não atualizado';
  return 'atualizado ' + timeAgo(new Date(Number(raw)).toISOString());
}

function renderTiktokCard(account){
  const { handle, name, accent } = account;
  const followers = localStorage.getItem('tt_followers_' + handle) || '';
  const likes = localStorage.getItem('tt_likes_' + handle) || '';
  const videos = localStorage.getItem('tt_videos_' + handle) || '';

  return `<div class="card" style="--card-accent:${accent}">
    <div class="card-head">
      <div class="avatar-wrap">
        <div class="avatar" style="display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text-faint);">TT</div>
        <div class="avatar-ring"></div>
      </div>
      <div>
        <div class="ch-name">${name}</div>
        <div class="ch-handle">${handle}</div>
      </div>
    </div>
    <div class="tiktok-field">
      <div class="tiktok-field-head">
        <span class="tiktok-field-label">▸ Seguidores</span>
        <span class="delta-badge tiktok-delta" data-handle="${handle}" style="display:none"></span>
      </div>
      <div class="tiktok-input-row">
        <input type="number" class="tiktok-input" data-handle="${handle}" data-field="followers" value="${followers}" min="0" placeholder="ex: 1500">
      </div>
    </div>
    <div class="tiktok-field">
      <div class="tiktok-field-head"><span class="tiktok-field-label">▸ Curtidas totais</span></div>
      <input type="number" class="tiktok-input" data-handle="${handle}" data-field="likes" value="${likes}" min="0" placeholder="ex: 32000">
    </div>
    <div class="tiktok-field">
      <div class="tiktok-field-head"><span class="tiktok-field-label">▸ Vídeos publicados</span></div>
      <input type="number" class="tiktok-input" data-handle="${handle}" data-field="videos" value="${videos}" min="0" placeholder="ex: 40">
    </div>
    <div class="tiktok-updated" data-handle="${handle}">Sem API pública do TikTok — ${tiktokUpdatedLabel(handle)}</div>
  </div>`;
}

document.addEventListener('change', (e) => {
  if (!e.target.matches('.tiktok-input')) return;
  const handle = e.target.dataset.handle;
  const field = e.target.dataset.field;
  const val = Math.max(0, Math.floor(Number(e.target.value)) || 0);
  localStorage.setItem(`tt_${field}_${handle}`, String(val));
  localStorage.setItem('tt_updated_' + handle, String(Date.now()));

  const card = e.target.closest('.card');
  const updatedEl = card.querySelector('.tiktok-updated');
  if (updatedEl) updatedEl.textContent = `Sem API pública do TikTok — ${tiktokUpdatedLabel(handle)}`;

  if (field === 'followers'){
    const baselineKey = 'tt_seen_followers_' + handle;
    const prev = localStorage.getItem(baselineKey);
    const badge = card.querySelector('.tiktok-delta');
    if (prev !== null && !isNaN(Number(prev)) && val > Number(prev) && badge){
      badge.textContent = `+${val - Number(prev)}`;
      badge.style.display = 'inline-block';
    } else if (badge){
      badge.style.display = 'none';
    }
    localStorage.setItem(baselineKey, String(val));
  }
});

async function fetchChannel({handle}){
  const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&forHandle=${encodeURIComponent(handle)}&key=${API_KEY}`);
  const chData = await chRes.json();
  if (chData.error) throw new Error(chData.error.message || 'Erro na API');
  if (!chData.items || !chData.items.length) throw new Error('Canal não encontrado');
  const channel = chData.items[0];
  const uploadsId = channel.contentDetails.relatedPlaylists.uploads;

  const plRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=3&playlistId=${uploadsId}&key=${API_KEY}`);
  const plData = await plRes.json();
  if (plData.error) throw new Error(plData.error.message || 'Erro ao buscar vídeos');
  const recentVideos = (plData.items || []).map(i => i.snippet);

  const ids = recentVideos.map(v => v.resourceId?.videoId).filter(Boolean);
  let statsMap = {};
  if (ids.length){
    const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${ids.join(',')}&key=${API_KEY}`);
    const vData = await vRes.json();
    if (vData.error) throw new Error(vData.error.message || 'Erro ao buscar estatísticas');
    (vData.items || []).forEach(v => { statsMap[v.id] = v.statistics; });
  }

  return { channel, recentVideos, statsMap };
}

function updateSummary(results){
  let subs = 0, views = 0, videos = 0, hasHidden = false;
  results.forEach(r => {
    if (!r) return;
    const s = r.channel.statistics;
    if (s.hiddenSubscriberCount) hasHidden = true;
    else subs += Number(s.subscriberCount || 0);
    views += Number(s.viewCount || 0);
    videos += Number(s.videoCount || 0);
  });
  document.getElementById('sumSubs').textContent = fmtNumber(subs) + (hasHidden ? '+' : '');
  document.getElementById('sumViews').textContent = fmtNumber(views);
  document.getElementById('sumVideos').textContent = videos;
}

async function refreshAll(){
  const results = await Promise.all(CHANNELS.map(async (c) => {
    try{
      const data = await fetchChannel(c);
      const vid = data.recentVideos?.[0]?.resourceId?.videoId;
      if (vid && lastVideoIds[c.handle] && lastVideoIds[c.handle] !== vid){
        showToast(`🔴 Novo vídeo no ar em ${data.channel.snippet.title}: "${data.recentVideos[0].title}"`);
      }
      if (vid) lastVideoIds[c.handle] = vid;
      return { c, data };
    }catch(err){
      const friendly = (err instanceof TypeError) ? 'Sem conexão no momento — toque para tentar de novo' : err.message;
      return { c, error: friendly };
    }
  }));

  grid.innerHTML = results.map(r => renderCard(r.c.handle, r.c.accent, r.data, r.error)).join('');
  updateSummary(results.map(r => r.data));
  lastUpdatedEl.textContent = `Última atualização: ${new Date().toLocaleTimeString('pt-BR')}`;
}
window.refreshAll = refreshAll;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 8000);
}

function updateCountdown(){
  const now = new Date();
  const target = new Date();
  target.setHours(20,30,0,0);
  if (target <= now) target.setDate(target.getDate()+1);
  const diff = target - now;
  const h = String(Math.floor(diff/3600000)).padStart(2,'0');
  const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  document.getElementById('countdown').textContent = `${h}:${m}:${s}`;
}

grid.innerHTML = CHANNELS.map(c => skeletonCard(c.accent)).join('');
refreshAll();
renderTiktokGrid();
setInterval(() => { lastAutoRefresh = Date.now(); refreshAll(); }, 5*60*1000);
setInterval(updateCountdown, 1000);
updateCountdown();
document.getElementById('refreshBtn').addEventListener('click', refreshAll);

// Quando você sai do app (troca de aba/app) e volta depois de um tempo,
// os timers ficam pausados nos bastidores — ao voltar, força uma
// atualização na hora em vez de deixar a tela "travada" com dado velho.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastAutoRefresh > 20000){
    lastAutoRefresh = Date.now();
    refreshAll();
  }
});
window.addEventListener('pageshow', (e) => {
  // pageshow com persisted=true acontece quando o navegador restaura a
  // página do cache (comum ao voltar de outro app pelo WhatsApp/Chrome)
  if (e.persisted) refreshAll();
});

// Só registra o service worker quando a página estiver hospedada em
// http(s) — em arquivo local (file://) o navegador bloqueia isso.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

document.addEventListener('input', (e) => {
  if (!e.target.matches('.hours-input')) return;
  const handle = e.target.dataset.handle;
  const val = Math.max(0, Math.floor(Number(e.target.value)) || 0);
  localStorage.setItem('ypp_hours_' + handle, val);

  const card = e.target.closest('.card');
  const pct = Math.min(100, (val / 8000) * 100);
  const remaining = Math.max(0, 8000 - val);
  const fillEl = card.querySelector('.hours-fill');
  const pctEl = card.querySelector('.hours-pct');
  const noteEl = card.querySelector('.hours-remaining');
  if (fillEl) fillEl.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct.toFixed(1) + '%';
  if (noteEl){
    noteEl.textContent = remaining === 0 ? '✓ Meta de horas atingida' : `Faltam ${fmtNumber(remaining)}h`;
    noteEl.classList.toggle('done', remaining === 0);
  }
});
</script>
</body>
